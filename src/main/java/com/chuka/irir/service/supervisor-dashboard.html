<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supervisor Dashboard - IRIR</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-score-low { background-color: #198754; color: white; } /* Green */
        .badge-score-med { background-color: #ffc107; color: black; } /* Yellow */
        .badge-score-high { background-color: #dc3545; color: white; } /* Red */
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">IRIR Supervisor</a>
    </div>
</nav>

<div class="container">
    <!-- Success Message Alert -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show mt-2" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Supervisor Dashboard</h2>
    </div>

    <!-- Filter Controls -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="card-title">Filter Projects</h5>
            <form th:action="@{/supervisor/projects/search}" method="get" class="row gx-3 gy-2 align-items-end">
                <div class="col-sm-3">
                    <label class="form-label" for="department">Department</label>
                    <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science">
                </div>
                <div class="col-sm-3">
                    <label class="form-label" for="keyword">Keyword</label>
                    <input type="text" class="form-control" id="keyword" name="keyword" placeholder="e.g. AI, Machine Learning">
                </div>
                <div class="col-sm-2">
                    <label class="form-label" for="year">Year</label>
                    <input type="number" class="form-control" id="year" name="year" placeholder="YYYY" min="2000" max="2100">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary px-4">Search</button>
                    <a th:href="@{/supervisor/dashboard}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Pending Projects Table -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h4 class="mb-0 text-primary">Pending Reviews</h4>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Title</th>
                        <th>Student Name</th>
                        <th>Upload Date</th>
                        <th>Similarity Score</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Example placeholder if none exist -->
                    <tr th:if="${pendingProjects == null || pendingProjects.isEmpty()}">
                        <td colspan="5" class="text-center py-4 text-muted">No pending projects assigned to you.</td>
                    </tr>
                    
                    <!-- Loop over pending projects -->
                    <tr th:each="project : ${pendingProjects}">
                        <td class="ps-4 fw-medium" th:text="${project.title}">Project Title</td>
                        <td th:text="${project.student.name}">Student Name</td>
                        <td th:text="${#temporals.format(project.uploadDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                        <td>
                            <!-- Similarity score badge with color coding -->
                            <span th:if="${project.similarityScore < 15}" class="badge badge-score-low" th:text="${project.similarityScore + '%'}"></span>
                            <span th:if="${project.similarityScore >= 15 && project.similarityScore < 40}" class="badge badge-score-med" th:text="${project.similarityScore + '%'}"></span>
                            <span th:if="${project.similarityScore >= 40}" class="badge badge-score-high" th:text="${project.similarityScore + '%'}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- View Detail Button -->
                            <a th:href="@{/supervisor/project/{id}(id=${project.id})}" class="btn btn-sm btn-outline-info me-1">Details</a>
                            
                            <!-- Review Modal Trigger -->
                            <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" th:data-bs-target="'#feedbackModal' + ${project.id}">
                                Review
                            </button>

                            <!-- Feedback Modal (Generated per project row to maintain distinct IDs) -->
                            <div class="modal fade" th:id="'feedbackModal' + ${project.id}" tabindex="-1" aria-labelledby="feedbackModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered text-start">
                                    <div class="modal-content border-0 shadow">
                                        <form th:action="@{/supervisor/project/{id}/review(id=${project.id})}" method="post">
                                            <div class="modal-header bg-light">
                                                <h5 class="modal-title text-primary" id="feedbackModalLabel">Review Project</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <!-- Project Context -->
                                                <div class="mb-3">
                                                    <p class="mb-1"><strong>Project:</strong> <span th:text="${project.title}">Title</span></p>
                                                    <p class="mb-0 text-muted small">By <span th:text="${project.student.name}">Student</span></p>
                                                </div>
                                                <hr>
                                                <!-- Review Form Inputs -->
                                                <div class="mb-3">
                                                    <label for="actionSelect" class="form-label fw-bold">Decision Action <span class="text-danger">*</span></label>
                                                    <select class="form-select" id="actionSelect" name="action" required>
                                                        <option value="" selected disabled>Select an action...</option>
                                                        <option value="APPROVED">Approve Project</option>
                                                        <option value="REJECTED">Reject Project</option>
                                                        <option value="FORWARDED_TO_INCUBATION">Forward to Incubation</option>
                                                    </select>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="commentTextarea" class="form-label fw-bold">Feedback / Comments</label>
                                                    <textarea class="form-control" id="commentTextarea" name="comment" rows="4" maxlength="2000" placeholder="Provide detailed feedback here (max 2000 chars)"></textarea>
                                                    <div class="form-text mt-1 text-end"><span id="charCount">0</span>/2000 characters</div>
                                                </div>
                                            </div>
                                            <div class="modal-footer bg-light">
                                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                                <button type="submit" class="btn btn-primary px-4">Submit Evaluation</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Optional: Display Approved/Rejected lists below if needed, here just keeping it to pending as per prompt focus -->

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Simple script to count characters in the furthest active textarea for feedback modal
    document.querySelectorAll('textarea[name="comment"]').forEach(textarea => {
        textarea.addEventListener('input', function() {
            var charCountSpan = this.nextElementSibling.querySelector('span');
            if (charCountSpan) {
                charCountSpan.textContent = this.value.length;
            }
        });
    });
</script>
</body>
</html>
