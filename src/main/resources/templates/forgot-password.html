<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding-top: 80px;">
    <div class="container" style="max-width: 440px;">

        <div class="content-card">
            <div class="content-card-header text-center">
                <h2><i class="bi bi-key me-2"></i>Reset Password</h2>
            </div>
            <div class="content-card-body">

                <div th:if="${successMessage}" class="alert alert-success">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${successMessage}">Success</span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <p class="text-muted mb-4">
                    Enter your registered email address and we will send you a password reset link.
                </p>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" name="email"
                               placeholder="your@email.ac.ke" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-send me-1"></i> Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
