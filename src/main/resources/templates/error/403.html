<!DOCTYPE html>
<html data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mt-5 pt-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <i class="bi bi-shield-lock display-1 text-warning mb-3 d-block"></i>
        <h1 class="display-4 fw-bold">403</h1>
        <p class="lead text-muted">Access Denied</p>
        <p th:text="${errorMessage}" class="text-muted">You do not have permission to access this resource.</p>
        <div class="mt-4">
            <a th:href="@{/dashboard}" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i> Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Go Back</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
