<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('System Logs')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dashboard-main">
        <div class="container">
            <div class="dashboard-header">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1 class="dashboard-title">
                            <i class="bi bi-journal-text me-2"></i>
                            System Logs
                        </h1>
                        <p class="dashboard-subtitle">Audit and operational logs</p>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <a th:href="@{/admin/users}" class="btn btn-outline-primary btn-lg">
                            <i class="bi bi-arrow-left me-2"></i> Back to Users
                        </a>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="content-card-header">
                    <h2><i class="bi bi-clock-history me-2"></i>Recent Activity</h2>
                </div>
                <div class="content-card-body">
                    <div th:if="${logs == null || logs.isEmpty()}" class="empty-state">
                        <i class="bi bi-inbox display-1 text-muted"></i>
                        <h4 class="mt-3">No Logs Yet</h4>
                        <p class="text-muted">System activity will appear here as users interact with the platform.</p>
                    </div>
                    <div th:if="${logs != null && !logs.isEmpty()}" class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Action</th>
                                    <th>User</th>
                                    <th>Entity</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${#temporals.format(log.timestamp, 'MMM dd, yyyy HH:mm')}">Apr 07, 2026 12:00</td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${log.action}">ACTION</span>
                                    </td>
                                    <td>
                                        <span th:if="${log.user != null}" th:text="${log.user.firstName + ' ' + log.user.lastName}">User</span>
                                        <span th:if="${log.user == null}" class="text-muted">System</span>
                                    </td>
                                    <td>
                                        <span th:text="${log.entityType != null ? log.entityType : 'â€”'}">â€”</span>
                                        <span th:if="${log.entityId != null}" class="text-muted">#<span th:text="${log.entityId}"></span></span>
                                    </td>
                                    <td th:text="${log.details != null ? log.details : 'â€”'}">Details</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${logs != null && !logs.isEmpty()}">
                        <a class="btn btn-outline-secondary" th:href="@{/admin/logs(page=${page - 1})}" th:if="${hasPrev}">
                            <i class="bi bi-chevron-left me-1"></i> Newer
                        </a>
                        <span class="text-muted small">Page <span th:text="${page + 1}">1</span></span>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/logs(page=${page + 1})}" th:if="${hasNext}">
                            Older <i class="bi bi-chevron-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
