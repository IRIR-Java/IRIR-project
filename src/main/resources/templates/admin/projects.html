<!DOCTYPE html>
<html data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('All Projects')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mt-5 pt-4 flex-grow-1">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-folder2-open me-2"></i>All Projects</h2>
            <p class="text-muted mb-0">Review, score, and manage all research projects</p>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card bg-dark border-secondary h-100">
                <div class="card-body text-center">
                    <i class="bi bi-collection fs-3 text-info"></i>
                    <h3 class="mt-2 mb-0" th:text="${totalCount}">0</h3>
                    <small class="text-muted">Total</small>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card bg-dark border-warning h-100">
                <div class="card-body text-center">
                    <i class="bi bi-hourglass-split fs-3 text-warning"></i>
                    <h3 class="mt-2 mb-0" th:text="${pendingCount}">0</h3>
                    <small class="text-muted">Pending Review</small>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card bg-dark border-success h-100">
                <div class="card-body text-center">
                    <i class="bi bi-check-circle fs-3 text-success"></i>
                    <h3 class="mt-2 mb-0" th:text="${approvedCount}">0</h3>
                    <small class="text-muted">Approved</small>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card bg-dark border-danger h-100">
                <div class="card-body text-center">
                    <i class="bi bi-flag fs-3 text-danger"></i>
                    <h3 class="mt-2 mb-0" th:text="${flaggedCount}">0</h3>
                    <small class="text-muted">Flagged</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card bg-dark border-secondary mb-4">
        <div class="card-body">
            <form th:action="@{/admin/projects}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Status Filter</label>
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"
                                th:selected="${s.name() == selectedStatus}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Search</label>
                    <input type="text" name="q" class="form-control" placeholder="Search by title or abstract..."
                           th:value="${query}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filter
                    </button>
                    <a th:href="@{/admin/projects}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Projects Table -->
    <div class="card bg-dark border-secondary">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Student</th>
                        <th>Status</th>
                        <th>Submitted</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="project, iter : ${projects}">
                        <td th:text="${iter.count}"></td>
                        <td>
                            <a th:href="@{/admin/projects/{id}(id=${project.id})}" class="text-info text-decoration-none fw-semibold"
                               th:text="${#strings.abbreviate(project.title, 60)}">Project Title</a>
                        </td>
                        <td>
                            <span th:if="${project.submittedBy != null}"
                                  th:text="${project.submittedBy.firstName + ' ' + project.submittedBy.lastName}">Student</span>
                            <span th:if="${project.submittedBy == null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${project.status.name() == 'DRAFT'} ? 'bg-secondary' :
                                                  (${project.status.name() == 'SUBMITTED'} ? 'bg-info' :
                                                  (${project.status.name() == 'UNDER_REVIEW'} ? 'bg-warning text-dark' :
                                                  (${project.status.name() == 'APPROVED'} ? 'bg-success' :
                                                  (${project.status.name() == 'REJECTED'} ? 'bg-danger' :
                                                  (${project.status.name() == 'FLAGGED'} ? 'bg-warning text-dark' : 'bg-purple')))))"
                                  th:text="${project.status.name()}">STATUS</span>
                        </td>
                        <td>
                            <span th:if="${project.submittedAt != null}"
                                  th:text="${#temporals.format(project.submittedAt, 'MMM dd, yyyy')}"></span>
                            <span th:if="${project.submittedAt == null}"
                                  th:text="${#temporals.format(project.createdAt, 'MMM dd, yyyy')}"></span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/projects/{id}(id=${project.id})}" class="btn btn-outline-info" title="View Details">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <form th:action="@{/admin/projects/{id}/ai-review(id=${project.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-warning" title="AI Analysis">
                                        <i class="bi bi-robot"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(projects)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            No projects found matching your criteria.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
