<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Directorate Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Research Analytics Dashboard</h1>

        <div class="row">
            <div class="col-md-6">
                <h3>Projects by Department</h3>
                <canvas id="departmentChart"></canvas>
            </div>
            <div class="col-md-6">
                <h3>Monthly Submission Trends</h3>
                <canvas id="trendsChart"></canvas>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <h3>Top Research Domains</h3>
                <canvas id="domainChart"></canvas>
            </div>
            <div class="col-md-6">
                <h3>Export Reports</h3>
                <a href="/directorate/export/pdf" class="btn btn-primary">Download PDF Report</a>
                <a href="/directorate/export/excel" class="btn btn-success">Download Excel Report</a>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <h3>High Potential Projects</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Student</th>
                            <th>Similarity Score</th>
                            <th>Views</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="project : ${highPotentialProjects}">
                            <td th:text="${project.title}"></td>
                            <td th:text="${project.owner != null ? project.owner.email : 'N/A'}"></td>
                            <td th:text="${project.similarityScore}"></td>
                            <td th:text="${project.viewCount}"></td>
                            <td>
                                <form th:action="@{'/directorate/project/' + ${project.projectId} + '/flag-incubation'}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-warning btn-sm">Flag for Incubation</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Department Chart
        const departmentCtx = document.getElementById('departmentChart').getContext('2d');
        new Chart(departmentCtx, {
            type: 'bar',
            data: {
                labels: /*[[${departmentLabels}]]*/,
                datasets: [{
                    label: 'Projects',
                    data: /*[[${departmentCounts}]]*/,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            }
        });

        // Trends Chart
        const trendsCtx = document.getElementById('trendsChart').getContext('2d');
        new Chart(trendsCtx, {
            type: 'line',
            data: {
                labels: /*[[${trendsLabels}]]*/,
                datasets: [{
                    label: 'Submissions',
                    data: /*[[${trendsCounts}]]*/,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    tension: 0.1
                }]
            }
        });

        // Domain Chart
        const domainCtx = document.getElementById('domainChart').getContext('2d');
        new Chart(domainCtx, {
            type: 'doughnut',
            data: {
                labels: /*[[${domainLabels}]]*/,
                datasets: [{
                    data: /*[[${domainCounts}]]*/,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.5)',
                        'rgba(54, 162, 235, 0.5)',
                        'rgba(255, 205, 86, 0.5)',
                        'rgba(75, 192, 192, 0.5)',
                        'rgba(153, 102, 255, 0.5)'
                    ]
                }]
            }
        });
    </script>
</body>
</html>
