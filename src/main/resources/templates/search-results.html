<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IRIR Gallery Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/gallery">IRIR Gallery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/student/dashboard">Student Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Filter (Offcanvas on Mobile, Col on Desktop) -->
        <div class="col-lg-3 d-none d-lg-block">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-funnel"></i> Filters</h5>
                    <form th:action="@{/gallery}" method="get" th:object="${searchCriteria}">
                        <div class="mb-3">
                            <label class="form-label">Search Query</label>
                            <input type="text" class="form-control" th:field="*{query}" placeholder="Title, keywords...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" th:field="*{department}">
                                <option value="">All Departments</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Software Engineering">Software Engineering</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" class="form-control" th:field="*{year}" placeholder="e.g. 2025">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author Name</label>
                            <input type="text" class="form-control" th:field="*{author}" placeholder="Student Name">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Apply Filters</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <!-- Mobile Filter Toggle Button -->
            <button class="btn btn-outline-primary d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
                <i class="bi bi-funnel"></i> Toggle Filters
            </button>

            <!-- Results Listing -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 th:text="${results.totalElements} + ' Projects Found'">Projects</h4>
            </div>

            <div th:each="project : ${results.content}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title">
                            <a th:href="@{/gallery/{id}(id=${project.projectId})}" th:text="${project.title}" class="text-decoration-none fw-bold">Project Title</a>
                        </h5>
                        <span th:if="${project.isSimilarityFree}" class="badge bg-success rounded-pill ms-2"><i class="bi bi-shield-check"></i> Verified Original</span>
                    </div>
                    
                    <div class="mb-2 text-muted fw-semibold small">
                        <i class="bi bi-person"></i> <span th:text="${project.author}">Author</span> &bull; 
                        <span class="badge bg-secondary" th:text="${project.department}">Department</span> &bull;
                        <i class="bi bi-calendar"></i> <span th:text="${project.year}">Year</span> &bull; 
                        <i class="bi bi-eye"></i> <span th:text="${project.viewCount}">Views</span>
                    </div>

                    <p class="card-text text-secondary mb-0">
                        <span th:utext="${project.highlightedText}">Project abstract excerpt with <mark class="bg-warning fw-bold">highlighted</mark> terms...</span>
                    </p>
                </div>
            </div>

            <!-- Pagination Controls -->
            <nav th:if="${results.totalPages > 1}" aria-label="Search results pages">
                <ul class="pagination justify-content-center mt-4">
                    <li class="page-item" th:classappend="${results.first ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/gallery(query=${searchCriteria.query}, department=${searchCriteria.department}, year=${searchCriteria.year}, author=${searchCriteria.author}, page=${results.number})}">&laquo; Prev</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, results.totalPages)}" 
                        class="page-item" th:classappend="${results.number + 1 == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/gallery(query=${searchCriteria.query}, department=${searchCriteria.department}, year=${searchCriteria.year}, author=${searchCriteria.author}, page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${results.last ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/gallery(query=${searchCriteria.query}, department=${searchCriteria.department}, year=${searchCriteria.year}, author=${searchCriteria.author}, page=${results.number + 2})}">Next &raquo;</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

<!-- Mobile Offcanvas Filter -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="filterSidebar">
    <div class="offcanvas-header bg-light">
        <h5 class="offcanvas-title"><i class="bi bi-funnel"></i> Search Filters</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <form th:action="@{/gallery}" method="get" th:object="${searchCriteria}">
            <div class="mb-3">
                <label class="form-label">Search Query</label>
                <input type="text" class="form-control" th:field="*{query}">
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <select class="form-select" th:field="*{department}">
                    <option value="">All Departments</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Software Engineering">Software Engineering</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" th:field="*{year}">
            </div>
            <div class="mb-3">
                <label class="form-label">Author Name</label>
                <input type="text" class="form-control" th:field="*{author}">
            </div>
            <button type="submit" class="btn btn-primary w-100">Apply Filters</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
