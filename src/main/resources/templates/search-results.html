<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Research Gallery')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="dashboard-main">
    <div class="container">

        <!-- Page Header -->
        <div class="dashboard-header">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="dashboard-title">
                        <i class="bi bi-globe me-2"></i>Research Gallery
                    </h1>
                    <p class="dashboard-subtitle">Explore published research projects</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <!-- Mobile Filter Toggle -->
                    <button class="btn btn-outline-primary d-lg-none"
                            type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
                        <i class="bi bi-funnel me-1"></i> Filters
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4">

            <!-- ==================== Left Sidebar Filter (desktop) ==================== -->
            <div class="col-lg-3 d-none d-lg-block">
                <div class="content-card">
                    <div class="content-card-header">
                        <h2><i class="bi bi-funnel me-2"></i>Filters</h2>
                    </div>
                    <div class="content-card-body">
                        <form th:action="@{/gallery}" method="get" th:object="${searchCriteria}">
                            <div class="mb-3">
                                <label class="form-label">Search Query</label>
                                <input type="text" class="form-control" th:field="*{query}"
                                       placeholder="Title, keywords...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Department</label>
                                <select class="form-select" th:field="*{department}">
                                    <option value="">All Departments</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Software Engineering">Software Engineering</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Year</label>
                                <input type="number" class="form-control" th:field="*{year}"
                                       placeholder="e.g. 2025">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author Name</label>
                                <input type="text" class="form-control" th:field="*{author}"
                                       placeholder="Student Name">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i> Apply Filters
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ==================== Results Column ==================== -->
            <div class="col-lg-9">

                <!-- Results count -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted fw-semibold"
                          th:text="${results.totalElements} + ' project(s) found'">0 projects found</span>
                </div>

                <!-- Empty state -->
                <div th:if="${results == null || results.totalElements == 0}" class="content-card">
                    <div class="content-card-body">
                        <div class="empty-state">
                            <i class="bi bi-search display-1 text-muted"></i>
                            <h4 class="mt-3">No Projects Found</h4>
                            <p class="text-muted">Try adjusting your filters or search terms.</p>
                        </div>
                    </div>
                </div>

                <!-- Result cards -->
                <div th:each="project : ${results.content}" class="content-card mb-3">
                    <div class="content-card-body">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <h5 class="mb-1 fw-semibold">
                                <a th:href="@{/gallery/{id}(id=${project.projectId})}"
                                   th:text="${project.title}"
                                   class="text-decoration-none">Project Title</a>
                            </h5>
                            <span th:if="${project.isSimilarityFree}"
                                  class="badge bg-success rounded-pill flex-shrink-0">
                                <i class="bi bi-shield-check me-1"></i>Verified Original
                            </span>
                        </div>

                        <div class="d-flex flex-wrap align-items-center gap-2 mt-2 mb-2 small text-muted">
                            <span><i class="bi bi-person me-1"></i><span th:text="${project.author}">Author</span></span>
                            <span class="badge bg-secondary" th:text="${project.department}">Department</span>
                            <span><i class="bi bi-calendar me-1"></i><span th:text="${project.year}">Year</span></span>
                            <span><i class="bi bi-eye me-1"></i><span th:text="${project.viewCount}">0</span> views</span>
                        </div>

                        <p class="mb-0 text-muted small">
                            <span th:utext="${project.highlightedText}">Abstract excerpt...</span>
                        </p>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${results != null && results.totalPages > 1}" aria-label="Search results pages">
                    <ul class="pagination justify-content-center mt-4">
                        <li class="page-item" th:classappend="${results.first ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/gallery(query=${searchCriteria.query},department=${searchCriteria.department},year=${searchCriteria.year},author=${searchCriteria.author},page=${results.number})}">&laquo; Prev</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(1, results.totalPages)}"
                            class="page-item" th:classappend="${results.number + 1 == i ? 'active' : ''}">
                            <a class="page-link"
                               th:href="@{/gallery(query=${searchCriteria.query},department=${searchCriteria.department},year=${searchCriteria.year},author=${searchCriteria.author},page=${i})}"
                               th:text="${i}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${results.last ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/gallery(query=${searchCriteria.query},department=${searchCriteria.department},year=${searchCriteria.year},author=${searchCriteria.author},page=${results.number + 2})}">Next &raquo;</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>
</main>

<!-- ==================== Mobile Offcanvas Filter ==================== -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="filterSidebar" aria-labelledby="filterSidebarLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="filterSidebarLabel">
            <i class="bi bi-funnel me-2"></i>Search Filters
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <form th:action="@{/gallery}" method="get" th:object="${searchCriteria}">
            <div class="mb-3">
                <label class="form-label">Search Query</label>
                <input type="text" class="form-control" th:field="*{query}" placeholder="Title, keywords...">
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <select class="form-select" th:field="*{department}">
                    <option value="">All Departments</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Software Engineering">Software Engineering</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" th:field="*{year}" placeholder="e.g. 2025">
            </div>
            <div class="mb-3">
                <label class="form-label">Author Name</label>
                <input type="text" class="form-control" th:field="*{author}" placeholder="Student Name">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-search me-1"></i> Apply Filters
            </button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
