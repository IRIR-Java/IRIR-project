<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Reset Password')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding-top: 80px;">
    <div class="container" style="max-width: 440px;">

        <div class="content-card">
            <div class="content-card-header text-center">
                <h2><i class="bi bi-shield-lock me-2"></i>Set New Password</h2>
            </div>
            <div class="content-card-body">

                <div th:if="${errorMessage}" class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-4">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" name="newPassword"
                               placeholder="Enter new password" required minlength="8" autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" name="confirmPassword"
                               placeholder="Confirm new password" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle me-1"></i> Reset Password
                    </button>
                </form>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
