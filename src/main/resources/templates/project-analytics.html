<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Project Analytics')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="dashboard-main">
    <div class="container">

        <!-- Header -->
        <div class="dashboard-header">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="dashboard-title">
                        <i class="bi bi-bar-chart-line me-2"></i> Project Analytics
                    </h1>
                    <p class="dashboard-subtitle" th:text="${project.title}">Project Title</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <a th:href="@{/student/projects/{id}(id=${project.id})}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Project
                    </a>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-sm-6 col-lg-3">
                <div class="content-card text-center py-3">
                    <div class="fs-1 fw-bold text-primary" th:text="${project.viewCount}">0</div>
                    <div class="text-muted"><i class="bi bi-eye me-1"></i>Total Views</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="content-card text-center py-3">
                    <div class="fs-1 fw-bold text-success" th:text="${project.downloadCount}">0</div>
                    <div class="text-muted"><i class="bi bi-download me-1"></i>Downloads</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="content-card text-center py-3">
                    <div class="fs-1 fw-bold text-info"
                         th:text="${project.keywords != null ? project.keywords.size() : 0}">0</div>
                    <div class="text-muted"><i class="bi bi-tags me-1"></i>Keywords</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="content-card text-center py-3">
                    <div class="fs-1 fw-bold"
                         th:classappend="${project.status.name() == 'APPROVED'} ? 'text-success' :
                                        (${project.status.name() == 'FLAGGED'} ? 'text-warning' : 'text-secondary')"
                         th:text="${project.status}">DRAFT</div>
                    <div class="text-muted"><i class="bi bi-circle me-1"></i>Status</div>
                </div>
            </div>
        </div>

        <div class="row g-4">

            <!-- Project Info -->
            <div class="col-lg-6">
                <div class="content-card">
                    <div class="content-card-header">
                        <h2><i class="bi bi-info-circle me-2"></i>Details</h2>
                    </div>
                    <div class="content-card-body">
                        <div class="row mb-3">
                            <div class="col-5 text-muted">Academic Year</div>
                            <div class="col-7" th:text="${project.academicYear != null ? project.academicYear : '—'}">—</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-5 text-muted">Supervisor</div>
                            <div class="col-7" th:text="${project.supervisor != null ? project.supervisor.fullName : 'Not assigned'}">—</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-5 text-muted">Submitted</div>
                            <div class="col-7"
                                 th:text="${project.submittedAt != null ? #temporals.format(project.submittedAt, 'dd MMM yyyy') : 'Not submitted'}">—</div>
                        </div>
                        <div class="row mb-3" th:if="${project.keywords != null && !project.keywords.isEmpty()}">
                            <div class="col-5 text-muted">Keywords</div>
                            <div class="col-7">
                                <div class="d-flex flex-wrap gap-1">
                                    <span class="badge bg-secondary" th:each="kw : ${project.keywords}" th:text="${kw}">kw</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Similar Projects -->
            <div class="col-lg-6">
                <div class="content-card">
                    <div class="content-card-header">
                        <h2><i class="bi bi-diagram-3 me-2"></i>Similar Projects in Repository</h2>
                    </div>
                    <div class="content-card-body">
                        <div th:if="${similarProjects == null || similarProjects.isEmpty()}" class="text-muted">
                            No similar projects found. Your work may be highly original!
                        </div>
                        <div th:if="${similarProjects != null && !similarProjects.isEmpty()}" class="d-grid gap-3">
                            <div th:each="p : ${similarProjects}" class="p-3 rounded border">
                                <a th:href="@{/gallery/{id}(id=${p.projectId})}"
                                   class="fw-semibold text-decoration-none"
                                   th:text="${p.title}">Project Title</a>
                                <div class="text-muted small mt-1">
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${p.author}">Author</span>
                                    &bull;
                                    <i class="bi bi-calendar me-1"></i>
                                    <span th:text="${p.year}">Year</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
