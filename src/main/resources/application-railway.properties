# ==============================================================================
# IRIR - Railway cloud deployment profile
# Activated by setting SPRING_PROFILES_ACTIVE=railway in Railway Variables
# ==============================================================================

# -------------------- MySQL (Railway plugin variables) --------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD}}

# -------------------- JPA --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# -------------------- H2 Console (disabled in cloud) --------------------
spring.h2.console.enabled=false

# -------------------- File storage --------------------
app.upload.dir=/app/uploads
app.lucene.index-dir=/app/lucene-index
