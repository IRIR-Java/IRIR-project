# ==============================================================================
# IRIR - Intelligent Research & Innovation Repository
# Application Configuration
# ==============================================================================

# -------------------- Server --------------------
server.port=8080
server.servlet.session.timeout=30m

# -------------------- Application --------------------
spring.application.name=IRIR

# -------------------- MySQL Database --------------------
# Supports both Railway plugin variable names (MYSQLHOST etc.) and custom names (DB_HOST etc.)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:irir_db}}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:${DB_PASSWORD:your_db_password}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------- JPA / Hibernate --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# -------------------- Connection Pool (HikariCP) --------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------- File Upload --------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom property: directory where uploaded project files are stored
app.upload.dir=uploads

# -------------------- Lucene Index --------------------
# Custom property: directory where the Lucene search index is stored
app.lucene.index-dir=${LUCENE_INDEX_DIR:lucene-index}

# -------------------- Similarity Detection (UC-02) --------------------
# Score >= this value triggers "Potential Duplicate" -> hold for supervisor review
app.similarity.threshold=0.70
# Score >= this value triggers "Similar Work Detected" -> warn student
app.similarity.warning-threshold=0.40
# Maximum number of candidate matches returned from Lucene MoreLikeThis query
app.similarity.max-results=10

# -------------------- Thymeleaf --------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------- Email (SMTP) Config --------------------
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:irir@chuka.ac.ke}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional: for testing, use a different SMTP server
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=your-email@example.com
# spring.mail.password=your-password

# -------------------- Scheduled Tasks --------------------
# Enables @Scheduled methods, e.g., token cleanup
spring.task.scheduling.enabled=true

# -------------------- AI (Gemini) --------------------
# Set GEMINI_API_KEY in environment to enable AI insights
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.gemini.temperature=${GEMINI_TEMPERATURE:0.3}
app.ai.gemini.max-output-tokens=${GEMINI_MAX_TOKENS:600}
